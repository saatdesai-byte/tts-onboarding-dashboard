function renderABG() {
  const el = document.getElementById('abg-content');
  if (!el) return;

  const STATUS_CFG = {
    'Live':         { bg:'#dcfce7', border:'#16a34a', color:'#15803d', icon:'✓', strip:'#16a34a' },
    'In Progress':  { bg:'#fffbeb', border:'#f59e0b', color:'#92400e', icon:'⟳', strip:'#f59e0b' },
    'Not Started':  { bg:'#f9fafb', border:'#d1d5db', color:'#374151', icon:'○', strip:'#9ca3af' },
    'EIN Transfer': { bg:'#eff6ff', border:'#3b82f6', color:'#1e40af', icon:'⇄', strip:'#3b82f6' },
  };

  function stepsDone(b) {
    if (b.status === 'Live' || b.shopStatus === 'Pattern Registered') return 3;
    if (b.shopStatus === 'Deactivated') return 1;
    if (b.status === 'EIN Transfer') return 1;
    return 0;
  }

  const counts = {};
  Object.keys(STATUS_CFG).forEach(s => counts[s] = ABG_BRANDS.filter(b => b.status === s).length);

  let filtered = ABG_BRANDS.slice();
  if (_abgFilter) filtered = filtered.filter(b => b.status === _abgFilter);
  if (_abgSearch) {
    const q = _abgSearch.toLowerCase();
    filtered = filtered.filter(b => b.brand.toLowerCase().includes(q) || b.opco.toLowerCase().includes(q));
  }

  let html = '';

  // ── KPI tiles ──────────────────────────────────────────────────────────────
  html += `<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px">`;
  Object.entries(STATUS_CFG).forEach(([s, c]) => {
    const active = _abgFilter === s;
    html += `<div onclick="_abgFilter=_abgFilter==='${s}'?null:'${s}';renderABG()"
      style="cursor:pointer;user-select:none;border-radius:14px;padding:16px 18px;
             background:${active ? c.bg : '#fff'};
             border:2px solid ${active ? c.border : '#e5e7eb'};
             box-shadow:${active ? `0 0 0 3px ${c.border}33,0 4px 12px ${c.border}22` : '0 1px 4px rgba(0,0,0,.05)'};
             transition:all .18s ease">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <span style="font-size:11px;font-weight:700;color:${active?c.color:'#6b7280'};text-transform:uppercase;letter-spacing:.06em">${s}</span>
        <span style="width:26px;height:26px;border-radius:8px;background:${active?c.border+'22':'#f3f4f6'};border:1.5px solid ${active?c.border:'#e5e7eb'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:${active?c.color:'#6b7280'}">${c.icon}</span>
      </div>
      <div style="font-size:34px;font-weight:900;color:${active?c.color:'#111'};line-height:1;letter-spacing:-.02em">${counts[s]}</div>
      <div style="font-size:11px;color:${active?c.color:'#9ca3af'};margin-top:4px">${counts[s]===1?'brand':'brands'}</div>
    </div>`;
  });
  html += `</div>`;

  // ── Search + filter bar ────────────────────────────────────────────────────
  html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
    <div style="flex:1;position:relative">
      <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:13px">⌕</span>
      <input type="text" placeholder="Search brand or OpCo…" value="${_abgSearch.replace(/"/g,'&quot;')}"
        oninput="_abgSearch=this.value;renderABG()"
        style="width:100%;padding:8px 12px 8px 28px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:13px;outline:none;background:#fff;transition:border-color .15s"
        onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e5e7eb'">
    </div>
    ${_abgFilter ? `
      <button onclick="_abgFilter=null;renderABG()"
        style="display:flex;align-items:center;gap:5px;padding:8px 12px;border:1.5px solid ${STATUS_CFG[_abgFilter].border};border-radius:9px;background:${STATUS_CFG[_abgFilter].bg};cursor:pointer;font-size:12px;font-weight:600;color:${STATUS_CFG[_abgFilter].color}">
        ${_abgFilter} <span style="opacity:.6">✕</span>
      </button>` : ''}
    ${_abgSearch ? `
      <button onclick="_abgSearch='';renderABG()"
        style="padding:8px 12px;border:1.5px solid #e5e7eb;border-radius:9px;background:#fff;cursor:pointer;font-size:12px;color:#6b7280">
        Clear ✕
      </button>` : ''}
    <span style="font-size:12px;color:#9ca3af;white-space:nowrap;padding:0 4px">${filtered.length} / ${ABG_BRANDS.length}</span>
  </div>`;

  if (!filtered.length) {
    html += `<div style="text-align:center;padding:60px 20px;color:#9ca3af;font-size:13px">No brands match your search.</div>`;
    el.innerHTML = html;
    return;
  }

  // ── Brand cards grid ───────────────────────────────────────────────────────
  html += `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">`;

  filtered.forEach(b => {
    const c     = STATUS_CFG[b.status];
    const color = nameColor(b.brand);
    const ini   = b.brand[0].toUpperCase();
    const exp   = _abgExpanded.has(b.brand);
    const done  = stepsDone(b);
    const STEPS = b.status === 'EIN Transfer'
      ? ['Existing', 'EIN / Agency', 'Pattern Live']
      : ['Shop Setup', 'Products', 'Live'];

    const checkSvg = `<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5l2 2L7.5 2.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    html += `
    <div onclick="toggleAbgExpand('${b.brand.replace(/'/g,"\\'")}')"
      style="cursor:pointer;background:#fff;border-radius:14px;overflow:hidden;
             border:1.5px solid ${exp ? c.border : '#e5e7eb'};
             box-shadow:${exp ? `0 6px 20px ${c.border}33` : '0 1px 4px rgba(0,0,0,.05)'};
             transition:all .18s ease"
      onmouseover="if(!${exp}){this.style.boxShadow='0 4px 14px rgba(0,0,0,.1)';this.style.borderColor='${c.border}88'}"
      onmouseout="this.style.boxShadow='${exp?`0 6px 20px ${c.border}33`:'0 1px 4px rgba(0,0,0,.05)'}';this.style.borderColor='${exp?c.border:'#e5e7eb'}'">

      <!-- Color strip -->
      <div style="height:5px;background:linear-gradient(90deg,${c.strip},${c.strip}99)"></div>

      <div style="padding:14px">
        <!-- Brand header -->
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px">
          <div style="width:38px;height:38px;border-radius:11px;background:${color}15;border:1.5px solid ${color}30;
                      display:flex;align-items:center;justify-content:center;
                      font-size:16px;font-weight:900;color:${color};flex-shrink:0;letter-spacing:-.02em">${ini}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:13px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3">${b.brand}</div>
            <div style="font-size:11px;color:#6b7280;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${b.opco}</div>
          </div>
          <div style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;
                      background:${c.bg};color:${c.color};border:1.5px solid ${c.border}55;
                      white-space:nowrap;flex-shrink:0">${c.icon} ${b.status}</div>
        </div>

        <!-- Progress track -->
        <div style="display:flex;align-items:flex-start;margin-bottom:12px;gap:0">
          ${STEPS.map((step, i) => {
            const isDone   = i < done;
            const isCurrent = i === done;
            const dotBg    = isDone ? c.strip : 'white';
            const dotBorder= isDone || isCurrent ? c.strip : '#d1d5db';
            const txtColor = isDone ? c.color : isCurrent ? c.color : '#9ca3af';
            const weight   = isDone || isCurrent ? '600' : '400';
            return `
              <div style="display:flex;flex-direction:column;align-items:center;flex:1">
                <div style="width:22px;height:22px;border-radius:50%;background:${dotBg};border:2px solid ${dotBorder};
                            display:flex;align-items:center;justify-content:center;transition:all .2s">
                  ${isDone ? checkSvg : `<div style="width:7px;height:7px;border-radius:50%;background:${isCurrent?c.strip:'#e5e7eb'}"></div>`}
                </div>
                <div style="font-size:9px;color:${txtColor};margin-top:3px;font-weight:${weight};text-align:center;line-height:1.3;max-width:52px">${step}</div>
              </div>
              ${i < STEPS.length - 1 ? `<div style="flex:0 0 auto;width:100%;max-width:24px;height:2px;background:${isDone?c.strip:'#e5e7eb'};margin-top:10px;border-radius:2px"></div>` : ''}
            `;
          }).join('')}
        </div>

        <!-- Tags row -->
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:${exp||b.blocker?'10px':'0'}">
          <span style="font-size:10px;padding:2px 8px;border-radius:6px;background:#f3f4f6;color:#4b5563;font-weight:500">${b.shopStatus}</span>
          ${b.skus ? `<span style="font-size:10px;padding:2px 8px;border-radius:6px;background:#eff6ff;color:#1d4ed8;font-weight:700">${b.skus} SKUs</span>` : ''}
          <span style="margin-left:auto;font-size:10px;color:#9ca3af;transition:transform .2s;display:inline-block;transform:${exp?'rotate(180deg)':'rotate(0deg)'}"">▾</span>
        </div>

        <!-- Blocker preview (collapsed) -->
        ${!exp && b.blocker ? `
          <div style="font-size:10px;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;
                      padding:5px 9px;border-radius:7px;line-height:1.4;
                      white-space:nowrap;overflow:hidden;text-overflow:ellipsis">⚠ ${b.blocker}</div>
        ` : ''}

        <!-- Expanded detail -->
        ${exp ? `
          <div style="border-top:1px solid #f3f4f6;padding-top:10px;animation:fadeIn .15s ease">
            <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em">Current Work</div>
            <div style="font-size:12px;color:#4b5563;line-height:1.65;margin-bottom:${b.blocker?'10px':'0'}">${b.currentWork}</div>
            ${b.blocker ? `
              <div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:9px;padding:10px 12px">
                <div style="font-size:10px;font-weight:800;color:#dc2626;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">⚠ Blocker</div>
                <div style="font-size:12px;color:#b91c1c;line-height:1.55">${b.blocker}</div>
              </div>` : ''}
          </div>
        ` : ''}
      </div>
    </div>`;
  });

  html += `</div>
  <style>@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}</style>`;

  el.innerHTML = html;
}

// ─── FULL DASHBOARD RENDER ───────────────────────────────────────────────────
function renderDashboard(brands, offboardingBrands = []) {
  _allBrands         = brands.filter(b => !b.completed);
  _offboardingBrands = offboardingBrands;
  _onboardedBrands   = brands.filter(b => b.completed);
  const now = new Date();

  const stageCounts = {};
  STAGE_ORDER.forEach(s => stageCounts[s] = 0);
  brands.forEach(b => { if (b.section in stageCounts) stageCounts[b.section]++; });

  const bc = { 'TikTok': 0, 'Brand / AM': 0, 'Pattern': 0, 'None': 0 };
  brands.forEach(b => {
    const bl = b.statusInfo?.blocker || null;
    if (bl) bc[bl]++; else bc['None']++;
  });

  const total       = brands.length;
  const totalBlocked= bc.TikTok + bc['Brand / AM'] + bc.Pattern;
  const onTrack     = total - totalBlocked;
  const inBinding   = stageCounts['BINDING'] || 0;
  const waitBlocked = stageCounts['WAITING/BLOCKED'] || 0;

  const daysArr = brands.filter(b => b.dateSigned).map(b => daysSince(b.dateSigned));
  const avgDays = daysArr.length ? Math.round(daysArr.reduce((a,v)=>a+v,0)/daysArr.length) : null;
  const maxDays = daysArr.length ? Math.max(...daysArr) : null;
  const maxCount = Math.max(...STAGE_ORDER.map(s => stageCounts[s]||0), 1);

  const mostUrgent = brands
    .filter(b => b.statusInfo?.blocker && b.dateSigned)
    .sort((a,b) => daysSince(b.dateSigned) - daysSince(a.dateSigned))[0];

  document.getElementById('root').innerHTML = `
    <div class="header">
      <div class="header-left">
        <div class="header-title">TikTok Shop - OPS tracker</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="as-of">Updated ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn ${_activeTab==='onboarding'?'active':''}"  data-tab="onboarding"  onclick="setActiveTab('onboarding')">Onboarding</button>
      <button class="tab-btn ${_activeTab==='offboarding'?'active':''}" data-tab="offboarding" onclick="setActiveTab('offboarding')">Offboarding</button>
      <button class="tab-btn ${_activeTab==='pipeline'?'active':''}"    data-tab="pipeline"    onclick="setActiveTab('pipeline')">Pipeline</button>
      <button class="tab-btn ${_activeTab==='contracts'?'active':''}"   data-tab="contracts"   onclick="setActiveTab('contracts')">Master</button>
      <button class="tab-btn ${_activeTab==='summary'?'active':''}"     data-tab="summary"     onclick="setActiveTab('summary')">Summary</button>
      <button class="tab-btn ${_activeTab==='abg'?'active':''}"         data-tab="abg"         onclick="setActiveTab('abg')">ABG</button>
    </div>

    <!-- ONBOARDING VIEW -->
    <div id="onboarding-view">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div class="onboarding-status">
          ${totalBlocked > 0 ? `<span class="pill pill-red">${totalBlocked} blocked</span>` : ''}
          <span class="pill pill-green">${onTrack} on track</span>
          ${inBinding > 0 ? `<span class="pill pill-blue">${inBinding} in binding</span>` : ''}
          <span class="pill pill-blue">live · Asana</span>
        </div>
        <div style="margin-left:auto;display:flex;gap:10px">
          <a href="https://app.asana.com/0/1213113488679843/list" target="_blank" class="refresh-btn" style="text-decoration:none">↗ Asana</a>
          <button class="refresh-btn" onclick="init()">↻ Refresh</button>
        </div>
      </div>

      <div class="pipeline-flow">
        <span class="pipeline-flow-title">Pipeline</span>
        ${PIPELINE_STEPS.map((s,i) => `
          <span class="pipe-chip" style="${STAGE_CHIP_STYLE[s]||''}"
            onclick="setFilter('stage','${s}')" title="Filter to ${STAGE_SHORT[s]}">
            ${STAGE_SHORT[s]}${stageCounts[s] ? ` <strong>${stageCounts[s]}</strong>` : ''}
          </span>
          ${i < PIPELINE_STEPS.length-1 ? '<span class="pipe-arrow">→</span>' : ''}
        `).join('')}
        ${waitBlocked > 0 ? `
          <span style="margin-left:14px;cursor:pointer" onclick="setFilter('stage','WAITING/BLOCKED')">
            <span style="font-size:11px;font-weight:500;background:#fffbeb;color:#92400e;border:1px solid #fde68a;padding:4px 10px;border-radius:4px;">
              ⚠ ${waitBlocked} waiting/blocked
            </span>
          </span>
        ` : ''}
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Total brands</div>
          <div class="metric-val">${total}</div>
          <div class="metric-sub">active pipeline</div>
        </div>
        <div class="metric">
          <div class="metric-label">Avg days since signed</div>
          <div class="metric-val" style="color:${avgDays>30?'#b45309':'#16a34a'}">${avgDays!==null?avgDays+'d':'—'}</div>
          <div class="metric-sub">longest: ${maxDays!==null?maxDays+'d':'—'}</div>
        </div>
        <div class="metric">
          <div class="metric-label">In binding</div>
          <div class="metric-val" style="color:${inBinding>0?'#0e7490':'#111'}">${inBinding}</div>
          <div class="metric-sub">awaiting contract</div>
        </div>
        <div class="metric">
          <div class="metric-label">Blocked by TikTok</div>
          <div class="metric-val" style="color:${bc.TikTok>0?'#dc2626':'#111'}">${bc.TikTok}</div>
          <div class="metric-sub">approval delays</div>
        </div>
        <div class="metric">
          <div class="metric-label">Blocked by Brand/AM</div>
          <div class="metric-val" style="color:${bc['Brand / AM']>0?'#dc2626':'#111'}">${bc['Brand / AM']}</div>
          <div class="metric-sub">missing info / handle</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-title">Avg days in pipeline by brand type</div>
        <div style="display:flex;flex-wrap:wrap;gap:12px">
          ${(() => {
            const types = {};
            brands.forEach(b => {
              if (!b.brandType || b.dateSigned === null) return;
              const d = daysSince(b.dateSigned);
              if (d === null) return;
              if (!types[b.brandType]) types[b.brandType] = { total: 0, count: 0 };
              types[b.brandType].total += d;
              types[b.brandType].count++;
            });
            return Object.entries(types).sort((a,b) => b[1].total/b[1].count - a[1].total/a[1].count).map(([type, {total, count}]) => {
              const avg = Math.round(total / count);
              const btShort = type.replace(' – New Shop','- New Shop').replace(' – Existing Shop','- Existing Shop').replace(' - New Shop','- New Shop').replace(' - Existing Shop','- Existing Shop').replace(' - HYBRID','- Hybrid');
              const color = type.includes('3P') ? '#0891b2' : type.includes('Affiliate') ? '#b45309' : '#7c3aed';
              const dayColor = avg > 30 ? '#dc2626' : avg > 14 ? '#b45309' : '#16a34a';
              return `<div style="background:${color}10;border:1px solid ${color}30;border-radius:8px;padding:12px 18px;min-width:130px">
                <div style="font-size:11px;font-weight:600;color:${color};margin-bottom:4px">${btShort}</div>
                <div style="font-size:24px;font-weight:700;color:${dayColor};line-height:1">${avg}d</div>
                <div style="font-size:11px;color:#999;margin-top:3px">${count} brand${count!==1?'s':''}</div>
              </div>`;
            }).join('');
          })()}
        </div>
      </div>

      <div class="two-col">
        <div class="card">
          <div class="card-title">Pipeline by stage <span style="font-size:11px;color:#aaa;font-weight:400">(click to filter)</span></div>
          ${STAGE_ORDER.map(s => {
            const count = stageCounts[s]||0;
            const pct = Math.round((count/maxCount)*100);
            return `<div class="stage-row">
              <div class="stage-label" onclick="setFilter('stage','${s}')">${STAGE_SHORT[s]||s}</div>
              <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${STAGE_COLOR[s]||'#888'}"></div></div>
              <div class="stage-count" style="color:${count===0?'#ccc':'#111'}">${count}</div>
            </div>`;
          }).join('')}
        </div>
        <div class="card">
          <div class="card-title">Blocker attribution <span style="font-size:11px;color:#aaa;font-weight:400">(click to filter)</span></div>
          ${[['TikTok','#b45309'],['Brand / AM','#dc2626'],['Pattern','#1d4ed8'],['None','#16a34a']].map(([name,color]) => {
            const count = bc[name];
            const pct = total > 0 ? Math.round((count/total)*100) : 0;
            return `<div class="blocker-row">
              <div class="b-dot" style="background:${color}"></div>
              <div class="b-name" onclick="setFilter('blocker','${name==='None'?'None':name}')">${name==='None'?'No blocker':name}</div>
              <div class="b-n">${count}</div>
              <div class="b-pct">${pct}%</div>
            </div>`;
          }).join('')}
          ${mostUrgent ? `
            <div class="b-divider"></div>
            <div class="b-note">Most urgent: <strong>${mostUrgent.name}</strong>
            — <span style="color:#dc2626">${daysSince(mostUrgent.dateSigned)}d</span> since signed</div>
          ` : ''}
        </div>
      </div>

      <div id="brand-table-section"></div>
      <div id="workload-section"></div>
      <div id="onboarded-section"></div>
    </div>

    <!-- OFFBOARDING VIEW -->
    <div id="offboarding-view" style="display:none">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="margin-left:auto;display:flex;gap:10px">
          <a href="https://app.asana.com/0/1213984215198318/list" target="_blank" class="refresh-btn" style="text-decoration:none">↗ Asana</a>
          <button class="refresh-btn" onclick="init()">↻ Refresh</button>
        </div>
      </div>
      <div id="offboarding-content"></div>
    </div>

    <!-- PIPELINE VIEW -->
    <div id="pipeline-view" style="display:none">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div class="onboarding-status">
          <span class="pill pill-blue">Salesforce · Creators 90D Close Date</span>
        </div>
        <div style="margin-left:auto;display:flex;gap:10px">
          <a href="https://patterninc.lightning.force.com/lightning/r/Report/00OTO000005Niez2AC/view" target="_blank" class="refresh-btn" style="text-decoration:none">↗ Salesforce</a>
        </div>
      </div>
      <div id="pipeline-content"></div>
    </div>

    <!-- MASTER VIEW -->
    <div id="contracts-view" style="display:none">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div class="onboarding-status">
          <span class="pill pill-blue">live · Master Sheet</span>
        </div>
        <div style="margin-left:auto;display:flex;gap:10px">
          <a href="https://docs.google.com/spreadsheets/d/179qZ2H7PXezB-xykCmdxNQzB767jHRh5QQQUuK34bDM" target="_blank" class="refresh-btn" style="text-decoration:none">↗ Open Sheet</a>
          <button class="refresh-btn" onclick="reloadMasterSheet()">↻ Refresh</button>
        </div>
      </div>
      <div id="contracts-content"></div>
    </div>

    <!-- SUMMARY VIEW -->
    <div id="summary-view" style="display:none">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div class="onboarding-status">
          <span class="pill pill-blue">live · Master Sheet</span>
        </div>
        <div style="margin-left:auto;display:flex;gap:10px">
          <a href="https://docs.google.com/spreadsheets/d/179qZ2H7PXezB-xykCmdxNQzB767jHRh5QQQUuK34bDM" target="_blank" class="refresh-btn" style="text-decoration:none">↗ Open Sheet</a>
          <button class="refresh-btn" onclick="reloadMasterSheet()">↻ Refresh</button>
        </div>
      </div>
      <div id="summary-content"></div>
    </div>

    <!-- ABG VIEW -->
    <div id="abg-view" style="display:none">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div class="onboarding-status">
          <span class="pill pill-blue">ABG Portfolio · ${ABG_BRANDS.length} brands</span>
        </div>
        <div style="margin-left:auto;display:flex;gap:10px">
          <span style="font-size:12px;color:#aaa;align-self:center">Static · update ABG_BRANDS to add brands</span>
        </div>
      </div>
      <div id="abg-content"></div>
    </div>

    <div class="footer">TikTok Shop OPS tracker · Pattern Operations · Refreshes on load</div>
  `;

  refreshTable();
  renderOffboardingSection();
  renderPipelineView();
  refreshContracts();
  renderSummary();
  renderABG();
  updateTabView();
}

// ─── TOKEN / LOADING / ERROR ─────────────────────────────────────────────────
function renderSetup(errorMsg) {
  document.getElementById('root').innerHTML = `
    <div class="token-setup">
      <h2>Connect to Asana</h2>
      <p>This dashboard reads live data from your Asana Onboarding 2026 project. Enter your Personal Access Token — stored in your browser only.</p>
      ${errorMsg ? `<div class="error-box">${errorMsg}</div>` : ''}
      <label>Personal Access Token</label>
      <input type="password" id="tokenInput" placeholder="1/1234567890:abcdef…" />
      <button onclick="handleConnect()">Connect →</button>
      <p class="token-note">
        Get your token at <a href="https://app.asana.com/0/developer-console" target="_blank">app.asana.com/0/developer-console</a>
        → Personal access tokens → Create new token.
      </p>
    </div>
  `;
  const inp = document.getElementById('tokenInput');
  inp?.focus();
  inp?.addEventListener('keydown', e => { if (e.key==='Enter') handleConnect(); });
}

function renderLoading() {
  document.getElementById('root').innerHTML = `
    <div class="header">
      <div class="header-left">
        <div class="header-title">TikTok Shop - OPS tracker</div>
        <span class="pill pill-blue">loading…</span>
      </div>
    </div>
    <div class="state-box"><div class="spinner"></div>Fetching from Asana…</div>
  `;
}

async function handleConnect() {
  const t = document.getElementById('tokenInput')?.value?.trim();
  if (!t) return;
  saveToken(t); await init();
}
function handleSignOut() { clearToken(); renderSetup(); }

// ─── SUMMARY VIEW ─────────────────────────────────────────────────────────────
function renderSummary() {
  const el = document.getElementById('summary-content');
  if (!el) return;
  if (!_masterBrands.length) {
    el.innerHTML = '<div class="state-box"><div class="spinner"></div>Loading master sheet…</div>';
    return;
  }

  const brands = _masterBrands;
  const total   = brands.length;
  const active  = brands.filter(b => b.stage === 'Active').length;
  const paused  = brands.filter(b => b.stage === 'Paused').length;
  const onboard = brands.filter(b => b.stage === 'Onboarding').length;
  const p0      = brands.filter(b => b.priority === 'P0').length;

  // Revenue sum (parse numeric values)
  const revenueTotal = brands.reduce((sum, b) => {
    const raw = (b.estRevenue || '').replace(/[$,M]/g, '');
    const n = parseFloat(raw);
    if (!isNaN(n)) return sum + (b.estRevenue.includes('M') ? n * 1000000 : n);
    return sum;
  }, 0);
  const revFmt = revenueTotal >= 1000000 ? `$${(revenueTotal/1000000).toFixed(1)}M` : revenueTotal > 0 ? `$${(revenueTotal/1000).toFixed(0)}K` : '—';

  // Health breakdown
  const healthMap = {};
  brands.forEach(b => {
    const h = b.health || 'Unknown';
    healthMap[h] = (healthMap[h] || 0) + 1;
  });
  const healthOrder = ['Optimized','On Track','Working','Pending','Review','Drafts','TT Violation','Issue','CRITICAL','URGENT','Unknown'];
  const healthColor = { 'Optimized':'#16a34a','On Track':'#1d4ed8','Working':'#1d4ed8','Pending':'#b45309','Review':'#b45309','Drafts':'#7c3aed','TT Violation':'#dc2626','Issue':'#dc2626','CRITICAL':'#dc2626','URGENT':'#dc2626','Unknown':'#9ca3af' };
  const maxHealth = Math.max(...Object.values(healthMap), 1);

  // Contract alerts
  const now = Date.now();
  const expired    = brands.filter(b => { const d = b.bindingEndDate && !['#N/A','N/A',''].includes(b.bindingEndDate) && new Date(b.bindingEndDate); return d && d < now; }).sort((a,b) => new Date(a.bindingEndDate)-new Date(b.bindingEndDate));
  const expiringSoon = brands.filter(b => { const d = b.bindingEndDate && !['#N/A','N/A',''].includes(b.bindingEndDate) && new Date(b.bindingEndDate); const days = d ? Math.floor((d-now)/86400000) : null; return days !== null && days >= 0 && days <= 60; }).sort((a,b2) => new Date(a.bindingEndDate)-new Date(b2.bindingEndDate));
  const critical   = brands.filter(b => b.health === 'CRITICAL' || b.health === 'URGENT');

  // AM summary
  const amMap = {};
  brands.forEach(b => {
    const am = b.am || 'Unassigned';
    if (!amMap[am]) amMap[am] = { count:0, blocked:0, p0:0, revenue:0, health:{} };
    amMap[am].count++;
    if (b.blocker) amMap[am].blocked++;
    if (b.priority === 'P0') amMap[am].p0++;
    const raw = (b.estRevenue||'').replace(/[$,M]/g,'');
    const n = parseFloat(raw);
    if (!isNaN(n)) amMap[am].revenue += b.estRevenue.includes('M') ? n*1000000 : n;
    const h = b.health || 'Unknown';
    amMap[am].health[h] = (amMap[am].health[h]||0)+1;
  });
  const amList = Object.entries(amMap).sort((a,b2) => b2[1].count - a[1].count);

  // Priority breakdown
  const prioMap = { P0:0, P1:0, P2:0, P3:0, P4:0 };
  brands.forEach(b => { if (prioMap[b.priority] !== undefined) prioMap[b.priority]++; });
  const prioColor = { P0:'#dc2626', P1:'#b45309', P2:'#0891b2', P3:'#16a34a', P4:'#9ca3af' };

  // 1P vs 3P
  const type1p = brands.filter(b => b.type === '1P').length;
  const type3p = brands.filter(b => b.type === '3P').length;

  let html = '';

  // Top KPIs
  html += `<div class="summary-grid" style="grid-template-columns:repeat(6,minmax(0,1fr))">
    <div class="metric"><div class="metric-label">Total brands</div><div class="metric-val">${total}</div><div class="metric-sub">in portfolio</div></div>
    <div class="metric"><div class="metric-label">Active</div><div class="metric-val" style="color:#16a34a">${active}</div><div class="metric-sub">live on TTS</div></div>
    <div class="metric"><div class="metric-label">Onboarding</div><div class="metric-val" style="color:#1d4ed8">${onboard}</div><div class="metric-sub">in progress</div></div>
    <div class="metric"><div class="metric-label">Paused</div><div class="metric-val" style="color:#b45309">${paused}</div><div class="metric-sub">on hold</div></div>
    <div class="metric"><div class="metric-label">P0 Brands</div><div class="metric-val" style="color:#dc2626">${p0}</div><div class="metric-sub">highest priority</div></div>
    <div class="metric"><div class="metric-label">Est. Revenue</div><div class="metric-val" style="font-size:20px;color:#16a34a">${revFmt}</div><div class="metric-sub">portfolio total</div></div>
  </div>`;

  // Alerts + Health side by side
  html += `<div class="two-col" style="margin-bottom:14px">`;

  // Alerts
  html += `<div style="display:flex;flex-direction:column;gap:12px">`;

  // Critical/Urgent
  if (critical.length) {
    html += `<div class="alert-card"><div class="alert-card-title">🚨 Critical / Urgent (${critical.length})</div>`;
    critical.forEach(b => {
      html += `<div class="alert-item"><span class="alert-brand">${b.brand}</span><span style="font-size:11px;font-weight:700;color:#dc2626">${b.health}</span><span class="alert-detail">${b.am||'—'} · ${b.blocker||b.actionItems||''}</span></div>`;
    });
    html += `</div>`;
  }

  // Expired contracts
  if (expired.length) {
    html += `<div class="alert-card"><div class="alert-card-title">⛔ Expired Contracts (${expired.length})</div>`;
    expired.slice(0,6).forEach(b => {
      const days = Math.floor((now - new Date(b.bindingEndDate)) / 86400000);
      html += `<div class="alert-item"><span class="alert-brand">${b.brand}</span><span style="font-size:11px;color:#dc2626;font-weight:600">${days}d ago</span><span class="alert-detail">${b.am||'—'}</span></div>`;
    });
    if (expired.length > 6) html += `<div style="font-size:11px;color:#aaa;padding-top:6px">+${expired.length-6} more</div>`;
    html += `</div>`;
  }

  // Expiring soon
  if (expiringSoon.length) {
    html += `<div class="alert-card amber"><div class="alert-card-title">⚠️ Expiring ≤60 Days (${expiringSoon.length})</div>`;
    expiringSoon.slice(0,6).forEach(b => {
      const days = Math.floor((new Date(b.bindingEndDate) - now) / 86400000);
      html += `<div class="alert-item"><span class="alert-brand">${b.brand}</span><span style="font-size:11px;color:#b45309;font-weight:600">${days}d left</span><span class="alert-detail">${b.am||'—'}</span></div>`;
    });
    if (expiringSoon.length > 6) html += `<div style="font-size:11px;color:#aaa;padding-top:6px">+${expiringSoon.length-6} more</div>`;
    html += `</div>`;
  }

  if (!critical.length && !expired.length && !expiringSoon.length) {
    html += `<div class="alert-card green"><div class="alert-card-title">✅ All Clear</div><div style="font-size:13px;color:#16a34a;padding:8px 0">No critical alerts</div></div>`;
  }

  html += `</div>`;

  // Health breakdown
  html += `<div class="card">
    <div class="card-title">Health breakdown <span style="font-size:11px;color:#aaa;font-weight:400">${total} brands</span></div>
    ${healthOrder.filter(h => healthMap[h]).map(h => {
      const count = healthMap[h] || 0;
      const pct = Math.round((count/maxHealth)*100);
      const color = healthColor[h] || '#888';
      return `<div class="health-bar-row">
        <div class="health-bar-label" style="color:${color};font-weight:${['CRITICAL','URGENT'].includes(h)?700:400}">${h}</div>
        <div style="flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--border)">
          <div class="health-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        <div class="health-bar-count" style="color:${color}">${count}</div>
      </div>`;
    }).join('')}

    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
      <div class="card-title" style="margin-bottom:10px">Brand type split</div>
      <div style="display:flex;gap:16px">
        <div style="text-align:center;background:#7c3aed18;border:1px solid #7c3aed33;border-radius:8px;padding:12px 24px">
          <div style="font-size:22px;font-weight:700;color:#7c3aed">${type1p}</div>
          <div style="font-size:11px;color:#7c3aed;font-weight:600">1P</div>
        </div>
        <div style="text-align:center;background:#0891b218;border:1px solid #0891b233;border-radius:8px;padding:12px 24px">
          <div style="font-size:22px;font-weight:700;color:#0891b2">${type3p}</div>
          <div style="font-size:11px;color:#0891b2;font-weight:600">3P</div>
        </div>
        ${Object.entries(prioMap).filter(([,v])=>v>0).map(([p,v]) => `
          <div style="text-align:center;background:${prioColor[p]}18;border:1px solid ${prioColor[p]}33;border-radius:8px;padding:12px 20px">
            <div style="font-size:20px;font-weight:700;color:${prioColor[p]}">${v}</div>
            <div style="font-size:11px;color:${prioColor[p]};font-weight:600">${p}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;

  html += `</div>`;

  // AM breakdown table
  html += `<div class="card" style="margin-top:14px">
    <div class="card-title">AM portfolio breakdown</div>
    <div class="table-wrap">
      <table class="am-table">
        <thead><tr>
          <th>Account Manager</th>
          <th style="text-align:right">Brands</th>
          <th style="text-align:right">P0</th>
          <th style="text-align:right">Blocked</th>
          <th style="text-align:right">Est. Revenue</th>
          <th>Health snapshot</th>
        </tr></thead>
        <tbody>
          ${amList.map(([am, d]) => {
            const rev = d.revenue >= 1000000 ? `$${(d.revenue/1000000).toFixed(1)}M` : d.revenue > 0 ? `$${(d.revenue/1000).toFixed(0)}K` : '—';
            const healthChips = Object.entries(d.health).sort((a,b2)=>b2[1]-a[1]).slice(0,3).map(([h,c]) => {
              const color = healthColor[h] || '#888';
              return `<span style="font-size:10px;font-weight:500;padding:1px 6px;border-radius:3px;background:${color}18;color:${color};border:1px solid ${color}33;margin-right:3px">${h} ${c}</span>`;
            }).join('');
            return `<tr>
              <td style="font-weight:600;font-size:13px">${am}</td>
              <td style="text-align:right;font-weight:600">${d.count}</td>
              <td style="text-align:right;color:${d.p0>0?'#dc2626':'#111'};font-weight:${d.p0>0?700:400}">${d.p0||'—'}</td>
              <td style="text-align:right;color:${d.blocked>0?'#dc2626':'#aaa'};font-weight:${d.blocked>0?600:400}">${d.blocked||'—'}</td>
              <td style="text-align:right;font-weight:600;color:#16a34a">${rev}</td>
              <td>${healthChips}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div style="font-size:11px;color:#aaa;margin-top:10px;padding-top:8px;border-top:1px solid #eee">
      Source: <a href="https://docs.google.com/spreadsheets/d/179qZ2H7PXezB-xykCmdxNQzB767jHRh5QQQUuK34bDM" target="_blank" style="color:var(--blue)">TikTok Shop Operations Master Sheet</a>
    </div>
  </div>`;

  el.innerHTML = html;
}

async function reloadMasterSheet() {
  const pEl = document.getElementById('pipeline-content');
  const cEl = document.getElementById('contracts-content');
  if (pEl) pEl.innerHTML = '<div class="state-box"><div class="spinner"></div>Refreshing master sheet…</div>';
  if (cEl) cEl.innerHTML = '';
  try {
    _masterBrands = await fetchMasterSheet();
    renderPipelineView();
    refreshContracts();
    renderSummary();
  } catch(e) {
    if (pEl) pEl.innerHTML = `<div class="error-box">Could not load master sheet: ${e.message}</div>`;
  }
}

const HARDCODED_TOKEN = '2/1212568941045213/1213965479253081:70d0dfaa80521c62436ceef653d14c94';
async function init() {
  const token = HARDCODED_TOKEN || loadToken();
  if (!token) { renderSetup(); return; }
  renderLoading();
  try {
    const [brands, offboardingBrands, masterBrands] = await Promise.all([
      fetchBrands(token),
      fetchOffboardingTasks(token).catch(() => []),
      fetchMasterSheet().catch(() => []),
    ]);
    _masterBrands = masterBrands;
    renderDashboard(brands, offboardingBrands);
  } catch (err) {
    if (err.message.includes('401') || err.message.toLowerCase().includes('unauthorized')) {
      clearToken(); renderSetup('Invalid token — please check and try again.');
    } else {
      document.getElementById('root').innerHTML = `
        <div class="header">
          <div class="header-left"><div class="header-title">TikTok Shop - OPS tracker</div></div>
          <button class="refresh-btn" onclick="init()">↻ Retry</button>
        </div>
        <div class="error-box">Could not load Asana data: ${err.message}</div>
        <div style="text-align:center;padding:20px;color:#777;font-size:13px">Check your connection and try again.</div>
      `;
    }
  }
}

init();
</script>
