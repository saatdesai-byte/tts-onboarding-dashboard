<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Shop - OPS tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f8f8f4;
    --border: #e8e8e0;
    --border2: #d8d8d0;
    --ink: #111111;
    --ink2: #555555;
    --ink3: #999999;
    --blue: #1d4ed8;
    --green: #16a34a;
    --amber: #b45309;
    --red: #dc2626;
    --cyan: #0e7490;
    --purple: #7c3aed;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; padding: 24px; font-size: 14px; line-height: 1.5;
  }
  .page { max-width: 1280px; margin: 0 auto; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .header-title { font-size: 17px; font-weight: 600; }
  .pill { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; border: 1px solid; }
  .pill-red   { background:#fef2f2; color:#dc2626; border-color:#fecaca; }
  .pill-green { background:#f0fdf4; color:#16a34a; border-color:#bbf7d0; }
  .pill-blue  { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .pill-amber { background:#fffbeb; color:#b45309; border-color:#fde68a; }
  .as-of { font-size: 12px; color: var(--ink3); }
  .refresh-btn {
    font-size: 12px; font-weight: 500; padding: 6px 14px;
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    background: var(--surface); cursor: pointer; color: var(--ink); transition: background .15s;
  }
  .refresh-btn:hover { background: var(--surface2); }

  /* Metrics */
  .metrics { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
  @media(max-width:860px) { .metrics { grid-template-columns: repeat(3,1fr); } }
  @media(max-width:560px) { .metrics { grid-template-columns: repeat(2,1fr); } }
  .metric {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .metric-label { font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
  .metric-val { font-size: 26px; font-weight: 600; line-height: 1; margin-bottom: 3px; }
  .metric-sub { font-size: 11px; color: var(--ink3); }

  /* Pipeline banner */
  .pipeline-flow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px 18px; margin-bottom: 16px;
  }
  .pipeline-flow-title { font-size: 11px; font-weight: 600; color: var(--ink3); margin-right: 14px; white-space: nowrap; text-transform: uppercase; letter-spacing:.04em; }
  .pipe-chip {
    font-size: 11px; font-weight: 500; padding: 4px 10px;
    border-radius: 4px; white-space: nowrap; border: 1px solid transparent;
    cursor: pointer; transition: opacity .15s;
  }
  .pipe-chip:hover { opacity: .72; }
  .pipe-arrow { color: var(--ink3); font-size: 12px; padding: 0 4px; }

  /* Two-col */
  .two-col { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap: 14px; margin-bottom: 14px; }
  @media(max-width:700px) { .two-col { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .card-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; color: var(--ink); }

  /* Stage bars */
  .stage-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .stage-row:last-of-type { border-bottom: none; }
  .stage-label { font-size: 12px; color: var(--ink2); width: 150px; flex-shrink: 0; cursor: pointer; }
  .stage-label:hover { color: var(--blue); text-decoration: underline; }
  .bar-wrap { flex: 1; height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .bar { height: 100%; border-radius: 4px; transition: width .5s ease; }
  .stage-count { font-size: 13px; font-weight: 600; width: 18px; text-align: right; flex-shrink: 0; }

  /* Blocker */
  .blocker-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .blocker-row:last-of-type { border-bottom: none; }
  .b-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .b-name { font-size: 13px; flex: 1; cursor: pointer; }
  .b-name:hover { color: var(--blue); text-decoration: underline; }
  .b-n { font-size: 15px; font-weight: 600; }
  .b-pct { font-size: 11px; color: var(--ink3); width: 34px; text-align: right; }
  .b-divider { height: 1px; background: var(--border); margin: 8px 0; }
  .b-note { font-size: 12px; color: var(--ink2); margin-top: 6px; }

  /* Ops workload mini-cards */
  .ops-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 10px; }
  .ops-card {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .ops-card:hover { border-color: var(--blue); background: #f5f8ff; }
  .ops-card.active { border-color: var(--blue); background: #eff6ff; }
  .ops-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .ops-stat { font-size: 11px; color: var(--ink2); display: flex; justify-content: space-between; margin-bottom: 2px; }
  .ops-stat span:last-child { font-weight: 600; }
  .ops-blocked { color: var(--red) !important; }

  /* Filter bar */
  .filter-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px;
    margin-bottom: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .filter-label { font-size: 11px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing:.04em; white-space: nowrap; }
  .filter-select {
    font-size: 12px; padding: 5px 10px; border: 1px solid var(--border2);
    border-radius: 20px; background: var(--surface); color: var(--ink2);
    cursor: pointer; outline: none;
  }
  .filter-select:focus { border-color: var(--blue); }
  .filter-divider { width: 1px; height: 20px; background: var(--border2); margin: 0 2px; }
  .filter-chip {
    display: flex; align-items: center; gap: 4px; font-size: 11px;
    background: #eff6ff; color: var(--blue); border: 1px solid #bfdbfe;
    border-radius: 20px; padding: 3px 8px 3px 10px; font-weight: 500;
  }
  .filter-chip button { background: none; border: none; cursor: pointer; color: #93c5fd; font-size: 14px; line-height: 1; padding: 0 0 0 2px; }
  .filter-chip button:hover { color: var(--blue); }
  .result-count { font-size: 12px; color: var(--ink3); margin-left: auto; }

  /* Sort bar */
  .sort-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .sort-label { font-size: 11px; color: var(--ink3); }
  .sort-btn {
    font-size: 11px; font-weight: 500; padding: 4px 10px;
    border: 1px solid var(--border2); border-radius: 20px;
    background: var(--surface); cursor: pointer; color: var(--ink2); white-space: nowrap;
  }
  .sort-btn.active { background: var(--surface2); color: var(--ink); font-weight: 600; }
  .sort-btn:hover { border-color: var(--blue); color: var(--blue); }

  /* Top tabs */
  .tab-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn {
    font-size: 12px; font-weight: 600; padding: 7px 12px;
    border: 1px solid var(--border2); border-radius: 999px;
    background: var(--surface); color: var(--ink2); cursor: pointer;
  }
  .tab-btn:hover { border-color: var(--blue); color: var(--blue); }
  .tab-btn.active { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }

  .onboarding-status {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 14px;
  }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    font-size: 11px; font-weight: 600; color: var(--ink3); text-align: left;
    padding: 0 10px 10px 0; border-bottom: 1px solid var(--border2);
    text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  th:hover { color: var(--blue); }
  th.sort-active { color: var(--blue); }
  td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .brand-name { font-weight: 600; font-size: 13px; }

  .stage-chip {
    display: inline-block; font-size: 11px; padding: 2px 8px;
    border-radius: 20px; background: var(--surface2); color: var(--ink2);
    border: 1px solid var(--border); white-space: nowrap;
  }

  /* Person avatar chip */
  .person-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 2px 8px 2px 4px;
    border-radius: 20px; border: 1px solid var(--border); white-space: nowrap;
    background: var(--surface2);
  }
  .avatar {
    width: 18px; height: 18px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: white; flex-shrink: 0;
  }
  .av-saat    { background: #7c3aed; }
  .av-sanskar { background: #0891b2; }
  .av-am      { background: #1d4ed8; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 500;
    padding: 2px 9px; border-radius: 20px; border: 1px solid; white-space: nowrap;
  }
  .badge-tiktok  { background:#fffbeb; color:#92400e;  border-color:#fde68a; }
  .badge-brand   { background:#fef2f2; color:#991b1b;  border-color:#fecaca; }
  .badge-pattern { background:#eff6ff; color:#1e40af;  border-color:#bfdbfe; }
  .badge-ok      { background:#f0fdf4; color:#15803d;  border-color:#bbf7d0; }
  .badge-wait    { background:#fffbeb; color:#92400e;  border-color:#fde68a; }
  .badge-none    { background:var(--surface2); color:var(--ink3); border-color:var(--border); }

  .days { font-weight: 600; }
  .days-ok   { color: var(--green); }
  .days-warn { color: var(--amber); }
  .days-crit { color: var(--red); }

  /* Progress dots */
  .progress-steps { display: flex; align-items: center; gap: 3px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .step-dot.done    { background: #16a34a; }
  .step-dot.current { background: #1d4ed8; box-shadow: 0 0 0 2px #bfdbfe; }
  .step-dot.waiting { background: #b45309; }
  .step-dot.pending { background: #e2e2da; }
  .step-connector   { width: 5px; height: 2px; background: #e2e2da; flex-shrink: 0; }
  .step-connector.done { background: #bbf7d0; }

  /* Task progress */
  .task-prog-wrap { height: 5px; border-radius: 3px; background: #e5e7eb; overflow: hidden; margin-top: 3px; }
  .task-prog-bar  { height: 100%; border-radius: 3px; transition: width .4s; }

  /* Spinner / states */
  .state-box { text-align: center; padding: 60px 20px; color: var(--ink2); font-size: 14px; }
  .spinner {
    width: 28px; height: 28px; border: 2px solid var(--border2);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius);
    padding: 14px 18px; color: #991b1b; font-size: 13px; margin-bottom: 16px;
  }
  .empty-state { text-align: center; padding: 32px 20px; color: var(--ink3); font-size: 13px; }

  /* Token setup */
  .token-setup {
    max-width: 540px; margin: 60px auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 28px;
  }
  .token-setup h2  { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .token-setup p   { font-size: 13px; color: var(--ink2); margin-bottom: 16px; }
  .token-setup label { font-size: 12px; font-weight: 600; color: var(--ink2); display: block; margin-bottom: 5px; }
  .token-setup input {
    width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm);
    padding: 9px 12px; font-size: 13px; font-family: 'SF Mono', Monaco, monospace;
    outline: none; margin-bottom: 12px;
  }
  .token-setup input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px #dbeafe; }
  .token-setup button {
    width: 100%; background: var(--blue); color: white; border: none;
    border-radius: var(--radius-sm); padding: 10px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .token-setup button:hover { background: #1e40af; }
  .token-note { font-size: 11px; color: var(--ink3); margin-top: 10px; }
  .token-note a { color: var(--blue); }

  /* ── PIPELINE KANBAN ─────────────────────────────────────────────────── */
  .kanban-wrap { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
  .kanban-col { min-width: 210px; max-width: 240px; flex-shrink: 0; }
  .kanban-col-header {
    font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 7px 7px 0 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .kanban-col-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 7px 7px; background: var(--surface2); padding: 8px; min-height: 60px; }
  .kanban-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 7px;
    transition: box-shadow .15s;
  }
  .kanban-card:last-child { margin-bottom: 0; }
  .kanban-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .kanban-card-name { font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--ink); }
  .kanban-card-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 3px; }
  .kanban-card-meta { font-size: 10px; color: var(--ink3); }

  /* Pipeline page stage summary stats */
  .pipeline-stage-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-bottom: 16px;
  }
  .pipeline-stage-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    cursor: pointer; transition: border-color .15s;
  }
  .pipeline-stage-card:hover { border-color: var(--blue); }
  .pipeline-stage-card.active { border-color: var(--blue); background: #eff6ff; }
  .psc-label { font-size: 11px; color: var(--ink2); margin-bottom: 4px; font-weight: 500; }
  .psc-val { font-size: 22px; font-weight: 700; line-height: 1; }

  /* ── CONTRACTS TABLE ─────────────────────────────────────────────────── */
  .contracts-metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
  @media(max-width:700px) { .contracts-metrics { grid-template-columns: repeat(2,1fr); } }

  .exp-badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px; white-space: nowrap;
  }
  .exp-expired  { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
  .exp-soon     { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
  .exp-ok       { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
  .exp-na       { background:var(--surface2); color:var(--ink3); border:1px solid var(--border); }

  .health-badge {
    display: inline-block; font-size: 11px; font-weight: 500;
    padding: 2px 7px; border-radius: 4px; white-space: nowrap;
  }
  .health-optimized  { background:#f0fdf4; color:#15803d; }
  .health-working    { background:#eff6ff; color:#1d4ed8; }
  .health-ontrack    { background:#eff6ff; color:#1d4ed8; }
  .health-pending    { background:#fffbeb; color:#b45309; }
  .health-critical   { background:#fef2f2; color:#dc2626; }
  .health-issue      { background:#fef2f2; color:#dc2626; }
  .health-urgent     { background:#fef2f2; color:#dc2626; font-weight:700; }
  .health-drafts     { background:#f5f3ff; color:#6d28d9; }
  .health-violation  { background:#fef2f2; color:#dc2626; }
  .health-review     { background:#fffbeb; color:#b45309; }

  .footer { font-size: 11px; color: var(--ink3); margin-top: 16px; text-align: center; }

  /* ── SUMMARY TAB ──────────────────────────────────────────────────────────── */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px; margin-bottom: 16px; }
  .alert-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
    border-left: 4px solid #dc2626;
  }
  .alert-card.amber { border-left-color: #b45309; }
  .alert-card.green { border-left-color: #16a34a; }
  .alert-card-title { font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 10px; text-transform: uppercase; letter-spacing:.03em; }
  .alert-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .alert-item:last-child { border-bottom: none; }
  .alert-brand { font-weight: 600; flex: 1; }
  .alert-detail { font-size: 11px; color: var(--ink3); }

  .health-bar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .health-bar-row:last-child { border-bottom: none; }
  .health-bar-label { font-size: 12px; color: var(--ink2); width: 110px; flex-shrink: 0; }
  .health-bar-fill { height: 8px; border-radius: 4px; min-width: 3px; transition: width .4s; }
  .health-bar-count { font-size: 12px; font-weight: 600; margin-left: 6px; }

  .am-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .am-table th { font-size: 11px; font-weight: 600; color: var(--ink3); text-align: left; padding: 0 10px 8px 0; border-bottom: 1px solid var(--border2); text-transform: uppercase; letter-spacing:.04em; }
  .am-table td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .am-table tr:last-child td { border-bottom: none; }
  .am-table tr:hover td { background: var(--surface2); }

  .prio-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
</style>
</head>

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const daysSince = d => d ? Math.floor((Date.now() - new Date(d)) / 86400000) : null;
const daysUntil = d => d ? Math.floor((new Date(d) - Date.now()) / 86400000) : null;

function daysClass(n) {
  if (n === null || n === undefined) return '';
  if (n <= 14) return 'days-ok';
  if (n <= 30) return 'days-warn';
  return 'days-crit';
}

function initials(name) {
  if (!name) return '?';
  const parts = name.trim().split(' ');
  return parts.length >= 2 ? parts[0][0] + parts[parts.length-1][0] : parts[0].slice(0,2);
}

function nameColor(name) {
  if (!name) return '#888';
  const key = name.toLowerCase().split(' ')[0];
  if (OPS_COLORS[key]) return OPS_COLORS[key];
  const palette = ['#1d4ed8','#0891b2','#7c3aed','#16a34a','#b45309','#be185d','#0f766e'];
  let h = 0; for (let i=0; i<name.length; i++) h = (h*31 + name.charCodeAt(i)) & 0xfffffff;
  return palette[h % palette.length];
}

function personChip(name, title, fullName = false) {
  if (!name) return `<span style="color:#ccc;font-size:12px">—</span>`;
  const color = nameColor(name);
  const ini = initials(name).toUpperCase();
  const display = fullName ? name : name.split(' ')[0];
  return `<span class="person-chip" title="${title || name}">
    <span class="avatar" style="background:${color}">${ini}</span>${display}
  </span>`;
}

function stageStep(s) { return PIPELINE_STEPS.indexOf(s); }

function progressStepsHtml(section) {
  const current = stageStep(section);
  const isWaiting = section === 'WAITING/BLOCKED';
  return PIPELINE_STEPS.map((s, i) => {
    const dotClass = isWaiting ? (i < current ? 'done' : 'pending')
                   : i < current  ? 'done'
                   : i === current ? 'current'
                   : 'pending';
    const connClass = (!isWaiting && i < current) ? 'done' : '';
    const conn = i < PIPELINE_STEPS.length - 1
      ? `<div class="step-connector ${connClass}"></div>` : '';
    return `<div class="step-dot ${dotClass}" title="${STAGE_SHORT[s]||s}"></div>${conn}`;
  }).join('');
}

function taskProgColor(label) {
  if (!label) return '#ccc';
  const l = label.toLowerCase();
  if (l.includes('complete')) return '#16a34a';
  if (l.includes('progress'))  return '#1d4ed8';
  if (l.includes('waiting') || l.includes('blocked')) return '#b45309';
  return '#888';
}

function taskProgPct(label) {
  if (!label) return 0;
  const l = label.toLowerCase();
  if (l.includes('complete')) return 100;
  if (l.includes('progress'))  return 55;
  if (l.includes('waiting'))   return 30;
  return 10;
}

// ─── CSV PARSER ───────────────────────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = [];
    let cur = '';
    let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) {
        cols.push(cur); cur = '';
      } else {
        cur += c;
      }
    }
    cols.push(cur);
    rows.push(cols);
  }
  return rows;
}

// ─── ASANA API ───────────────────────────────────────────────────────────────
async function asana(path, token) {
  const r = await fetch(`https://app.asana.com/api/1.0${path}`, {
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' }
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.errors?.[0]?.message || `HTTP ${r.status}`);
  }
  return r.json();
}

async function fetchBrands(token) {
  const fields = [
    'name','completed',
    'custom_fields.gid','custom_fields.name',
    'custom_fields.display_value','custom_fields.enum_value',
    'custom_fields.text_value','custom_fields.date_value',
    'memberships.section.name','memberships.section.gid',
    'assignee.name',
  ].join(',');

  const data = await asana(`/tasks?project=${PROJECT_ID}&opt_fields=${fields}&limit=100`, token);

  return data.data
    .map(t => {
      const cf = {};
      let taskProgressLabel = null;
      let accountManager    = null;

      (t.custom_fields || []).forEach(f => {
        cf[f.gid] = f.display_value || f.text_value || f.date_value?.date || null;
        if (f.gid === FIELD.onboardingStatus) cf._statusGid = f.enum_value?.gid || null;
        if (f.gid === FIELD.taskProgress)     taskProgressLabel = f.display_value || null;
        if (f.gid === FIELD.accountManager)   accountManager = f.display_value || null;
      });

      const section    = t.memberships?.[0]?.section?.name || 'Unknown';
      const brandName  = cf[FIELD.brandName] || t.name || '';
      const dateSigned = cf[FIELD.dateSigned] || null;
      const brandType  = cf[FIELD.brandType] || null;
      const statusGid  = cf._statusGid;
      const statusInfo = STATUS[statusGid] || null;
      const ops = t.assignee?.name || null;

      return {
        name: brandName, section, dateSigned,
        brandType, statusGid, statusInfo,
        ops, accountManager,
        taskProgressLabel,
        rawName: t.name,
        completed: statusGid === '1213187098790837' || !!t.completed,
      };
    })
    .filter(b => b.name && b.name.trim());
}

async function fetchOffboardingTasks(token) {

}

// ─── FILTER + SORT (Onboarding) ───────────────────────────────────────────────
function applyFiltersSort(brands) {
  let out = brands.slice();
  if (_filters.stage)   out = out.filter(b => b.section === _filters.stage);
  if (_filters.blocker) {
    if (_filters.blocker === 'None') out = out.filter(b => !b.statusInfo?.blocker);
    else out = out.filter(b => b.statusInfo?.blocker === _filters.blocker);
  }
  if (_filters.ops) out = out.filter(b => b.ops === _filters.ops);
  if (_filters.am)  out = out.filter(b => b.accountManager === _filters.am);

  out.sort((a, b) => {
    let va, vb;
    if (_sortBy === 'days')  { va = daysSince(a.dateSigned) ?? -1; vb = daysSince(b.dateSigned) ?? -1; }
    else if (_sortBy === 'stage') { va = STAGE_ORDER.indexOf(a.section); vb = STAGE_ORDER.indexOf(b.section); }
    else if (_sortBy === 'ops')   { va = a.ops || ''; vb = b.ops || ''; }
    else if (_sortBy === 'am')    { va = a.accountManager || ''; vb = b.accountManager || ''; }
    else if (_sortBy === 'name')  { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
    if (va < vb) return _sortDir;
    if (va > vb) return -_sortDir;
    return 0;
  });
  return out;
}

function setFilter(type, value) {
  _filters[type] = _filters[type] === value ? null : value;
  refreshTable();
}
function clearAllFilters() { _filters = { stage:null, blocker:null, ops:null, am:null }; refreshTable(); }
function setSort(field) {
  if (_sortBy === field) _sortDir *= -1;
  else { _sortBy = field; _sortDir = (field==='name'||field==='ops'||field==='am') ? 1 : -1; }
  refreshTable();
}

function setActiveTab(tab) {
  _activeTab = tab;

function updateTabView() {
  ['onboarding','offboarding','pipeline','contracts','summary','abg'].forEach(t => {
    const el = document.getElementById(t + '-view');

// ─── OFFBOARDING VIEW ─────────────────────────────────────────────────────────
function renderOffboardingSection() {
  const el = document.getElementById('offboarding-content');
  if (!el) return;
  const active    = _offboardingBrands.filter(b => b.section !== 'Complete');
  const completed = _offboardingBrands.filter(b => b.section === 'Complete');
  const stageCounts = {};
  OFFBOARD_STAGES.forEach(s => stageCounts[s] = 0);
  active.forEach(b => { if (b.section in stageCounts) stageCounts[b.section]++; });
  let html = '<div class="metrics" style="grid-template-columns:repeat(4,minmax(0,1fr))">';
  html += '<div class="metric"><div class="metric-label">Active offboardings</div><div class="metric-val">' + active.length + '</div><div class="metric-sub">in pipeline</div></div>';
  html += '<div class="metric"><div class="metric-label">Initiated</div><div class="metric-val">' + (stageCounts['Initiated']||0) + '</div><div class="metric-sub">awaiting kickoff</div></div>';
  html += '<div class="metric"><div class="metric-label">Listings Offboarding</div><div class="metric-val">' + (stageCounts['Listings Offboarding']||0) + '</div><div class="metric-sub">in progress</div></div>';
  html += '<div class="metric"><div class="metric-label">Access Removal</div><div class="metric-val">' + (stageCounts['Access Removal']||0) + '</div><div class="metric-sub">final stage</div></div></div>';
  html += '<div class="card"><div class="card-title">Active Offboardings</div>';
  if (active.length === 0) {
    html += '<div class="empty-state">No active offboardings 🎉</div>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>Brand</th><th>Stage</th><th>Type</th><th>Ops Owner</th><th>Days</th></tr></thead><tbody>';
    active.sort((a,b) => (new Date(a.createdAt||0))-(new Date(b.createdAt||0))).forEach(b => {
      const days = b.createdAt ? Math.floor((Date.now()-new Date(b.createdAt))/86400000) : null;
      const cs = OFFBOARD_CHIP_STYLE[b.section]||'';
      const btc = b.brandType?.includes('3P') ? '#0891b2' : b.brandType?.includes('1P') ? '#7c3aed' : '#888';
      html += '<tr><td class="brand-name">' + b.name + '</td>';
      html += '<td><span class="stage-chip" style="' + cs + '">' + b.section + '</span></td>';
      html += '<td>' + (b.brandType ? '<span style="font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;background:' + btc + '18;color:' + btc + ';border:1px solid ' + btc + '33">' + b.brandType + '</span>' : '<span style="color:#ccc;font-size:12px">—</span>') + '</td>';
      html += '<td>' + personChip(b.ops,'Ops owner') + '</td>';
      html += '<td><span class="days ' + daysClass(days) + '">' + (days!==null?days+'d':'—') + '</span></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '<div style="font-size:11px;color:#aaa;margin-top:12px;padding-top:10px;border-top:1px solid #eee">Source: Asana Offboarding TTS 2026</div></div>';
  if (completed.length > 0) {
    html += '<div class="card" style="margin-top:16px"><div class="card-title">Completed Offboardings <span style="font-size:13px;color:#aaa;font-weight:400">(' + completed.length + ')</span></div>';
    html += '<div class="table-wrap"><table><thead><tr><th>Brand</th><th>Type</th><th>Ops Owner</th></tr></thead><tbody>';
    completed.forEach(b => {
      const btc = b.brandType?.includes('3P') ? '#0891b2' : b.brandType?.includes('1P') ? '#7c3aed' : '#888';
      html += '<tr><td class="brand-name">' + b.name + '</td>';
      html += '<td>' + (b.brandType ? '<span style="font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;background:' + btc + '18;color:' + btc + ';border:1px solid ' + btc + '33">' + b.brandType + '</span>' : '<span style="color:#ccc;font-size:12px">—</span>') + '</td>';
      html += '<td>' + personChip(b.ops,'Ops owner') + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }
  el.innerHTML = html;
}

// ─── PIPELINE VIEW (Salesforce · Creators 90D) ───────────────────────────────
function setPipelineStageFilter(stage) {
  _pipelineStageFilter = _pipelineStageFilter === stage ? null : stage;
  renderPipelineView();
}

function renderPipelineView() {
  const el = document.getElementById('pipeline-content');
  if (!el) return;

  const fmtAmt = n => n >= 1000000 ? `$${(n/1000000).toFixed(1)}M` : n > 0 ? `$${(n/1000).toFixed(0)}K` : '—';
  const FORECAST_STYLE = {
    'Commit':    { bg:'#f0fdf4', border:'#bbf7d0', hdr:'#dcfce7', color:'#15803d' },
    'Best Case': { bg:'#eff6ff', border:'#bfdbfe', hdr:'#dbeafe', color:'#1e40af' },
    'Upside':    { bg:'#fefce8', border:'#fde68a', hdr:'#fef9c3', color:'#92400e' },
  };
  const STAGE_COLOR = {
    'Stage 0: Engage':'#9ca3af','Stage 1: Verify':'#60a5fa','Stage 2: Proposal':'#a78bfa',
    'Stage 3: Buy In':'#f97316','Stage 4: Negotiations':'#16a34a'
  };
  const reps = [...new Set(PIPELINE_DEALS.map(d => d.rep))].sort();
  const filtered = PIPELINE_DEALS.filter(d =>
    (!_pipelineRepFilter || d.rep === _pipelineRepFilter) &&
    (!_pipelineForecastFilter || d.forecast === _pipelineForecastFilter)
  );
  const totalAmt = filtered.reduce((s,d) => s+d.amount, 0);
  const commitAmt = filtered.filter(d=>d.forecast==='Commit').reduce((s,d)=>s+d.amount,0);
  const bestAmt   = filtered.filter(d=>d.forecast==='Best Case').reduce((s,d)=>s+d.amount,0);
  const upsideAmt = filtered.filter(d=>d.forecast==='Upside').reduce((s,d)=>s+d.amount,0);
  let html = '';

  // KPIs
  html += `<div class="metrics" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px">
    <div class="metric"><div class="metric-label">Total Pipeline</div><div class="metric-val" style="color:#1d4ed8;font-size:22px">${fmtAmt(totalAmt)}</div><div class="metric-sub">${filtered.length} deals</div></div>
    <div class="metric" style="border-left:3px solid #16a34a"><div class="metric-label">Commit</div><div class="metric-val" style="color:#16a34a;font-size:20px">${fmtAmt(commitAmt)}</div><div class="metric-sub">${filtered.filter(d=>d.forecast==='Commit').length} deals</div></div>
    <div class="metric" style="border-left:3px solid #1d4ed8"><div class="metric-label">Best Case</div><div class="metric-val" style="color:#1d4ed8;font-size:20px">${fmtAmt(bestAmt)}</div><div class="metric-sub">${filtered.filter(d=>d.forecast==='Best Case').length} deals</div></div>
    <div class="metric" style="border-left:3px solid #b45309"><div class="metric-label">Upside</div><div class="metric-val" style="color:#b45309;font-size:20px">${fmtAmt(upsideAmt)}</div><div class="metric-sub">${filtered.filter(d=>d.forecast==='Upside').length} deals</div></div>
  </div>`;

  // Filters
  html += `<div class="filter-bar">
    <span class="filter-label">Filter</span>
    <select class="filter-select" onchange="_pipelineRepFilter=this.value||null;renderPipelineView()">
      <option value="">All Reps</option>
      ${reps.map(r=>`<option value="${r}" ${_pipelineRepFilter===r?'selected':''}>${r.split(' ')[0]}</option>`).join('')}
    </select>
    <select class="filter-select" onchange="_pipelineForecastFilter=this.value||null;renderPipelineView()">
      <option value="">All Forecasts</option>
      ${['Commit','Best Case','Upside'].map(f=>`<option value="${f}" ${_pipelineForecastFilter===f?'selected':''}>${f}</option>`).join('')}
    </select>
    ${(_pipelineRepFilter||_pipelineForecastFilter)?`<button onclick="_pipelineRepFilter=null;_pipelineForecastFilter=null;renderPipelineView()" style="font-size:11px;padding:4px 10px;border:1px solid var(--border2);border-radius:20px;background:none;cursor:pointer;color:var(--ink2)">Clear ×</button>`:''}
    <span class="result-count">${filtered.length} deals · ${fmtAmt(totalAmt)}</span>
  </div>`;

  // Kanban by forecast
  html += `<div class="kanban-wrap">`;
  for (const fc of ['Commit','Best Case','Upside']) {
    const st = FORECAST_STYLE[fc];
    const cards = filtered.filter(d => d.forecast === fc).sort((a,b) => b.amount - a.amount);
    const colTotal = cards.reduce((s,d)=>s+d.amount,0);
    html += `<div class="kanban-col" style="min-width:280px;max-width:320px">
      <div class="kanban-col-header" style="background:${st.hdr};color:${st.color};border:1px solid ${st.border};border-bottom:none">
        <span style="font-weight:700">${fc}</span>
        <span style="font-size:11px;background:white;padding:2px 8px;border-radius:20px;color:${st.color};font-weight:700">${fmtAmt(colTotal)}</span>
      </div>
      <div class="kanban-col-body" style="background:${st.bg}20;border:1px solid ${st.border};border-top:none;border-radius:0 0 7px 7px;padding:8px;min-height:60px">
        ${cards.map(d => {
          const stageColor = STAGE_COLOR[d.stage] || '#888';
          const brandName = d.opp.replace(/ \| TTS$/,'').replace(/ - TTS$/,'').replace(' | NextWave Campaign','').replace(' - Marketplaces','');
          return `<div class="kanban-card" style="margin-bottom:7px">
            <div class="kanban-card-name" style="font-size:12px;font-weight:600;margin-bottom:6px">${brandName}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:4px">
              <span style="font-size:13px;font-weight:700;color:#16a34a">${d.amount>0?fmtAmt(d.amount):'TBD'}</span>
              <span style="font-size:10px;color:${d.type==='Creators'?'#7c3aed':'#0891b2'};font-weight:600">${d.type==='Creators'?'Creator':'3P'}</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span style="font-size:10px;font-weight:500;padding:1px 6px;border-radius:3px;background:${stageColor}18;color:${stageColor};border:1px solid ${stageColor}33">${d.stage.replace('Stage ','S')}</span>
              <span style="font-size:10px;color:var(--ink3)">Close ${d.close}</span>
            </div>
            <div style="font-size:10px;color:var(--ink3);margin-top:3px">👤 ${d.rep.split(' ')[0]}</div>
          </div>`;
        }).join('')}
        ${cards.length===0?`<div style="text-align:center;padding:16px;color:#ccc;font-size:12px">No deals</div>`:''}
      </div>
    </div>`;
  }
  html += '</div>';

  // Rep breakdown
  const repSummary = {};
  filtered.forEach(d => {
    if (!repSummary[d.rep]) repSummary[d.rep] = { commit:0, bestCase:0, upside:0, total:0, count:0 };
    repSummary[d.rep].total += d.amount; repSummary[d.rep].count++;
    if (d.forecast==='Commit') repSummary[d.rep].commit += d.amount;
    if (d.forecast==='Best Case') repSummary[d.rep].bestCase += d.amount;
    if (d.forecast==='Upside') repSummary[d.rep].upside += d.amount;
  });
  html += `<div class="card" style="margin-top:14px">
    <div class="card-title">Rep breakdown</div>
    <div class="table-wrap"><table class="am-table">
      <thead><tr><th>Rep</th><th style="text-align:right">Deals</th><th style="text-align:right;color:#16a34a">Commit</th><th style="text-align:right;color:#1d4ed8">Best Case</th><th style="text-align:right;color:#b45309">Upside</th><th style="text-align:right">Total</th></tr></thead>
      <tbody>${Object.entries(repSummary).sort((a,b)=>b[1].total-a[1].total).map(([rep,d])=>
        `<tr><td style="font-weight:600;cursor:pointer;color:var(--blue)" onclick="_pipelineRepFilter='${rep}';renderPipelineView()">${rep}</td>
        <td style="text-align:right">${d.count}</td>
        <td style="text-align:right;color:#16a34a;font-weight:600">${d.commit>0?fmtAmt(d.commit):'—'}</td>
        <td style="text-align:right;color:#1d4ed8;font-weight:600">${d.bestCase>0?fmtAmt(d.bestCase):'—'}</td>
        <td style="text-align:right;color:#b45309;font-weight:600">${d.upside>0?fmtAmt(d.upside):'—'}</td>
        <td style="text-align:right;font-weight:700">${fmtAmt(d.total)}</td></tr>`
      ).join('')}</tbody>
    </table></div>
    <div style="font-size:11px;color:#aaa;margin-top:10px;padding-top:8px;border-top:1px solid #eee">Source: Salesforce · Creators 90D Close Date · As of 2026-06-09</div>
  </div>`;

  // dummy block to satisfy old function body structure
  if (false) {

  const stages = MS_STAGE_ORDER.filter(s => _masterBrands.some(b => b.stage === s));
  const stageCounts = {};
  stages.forEach(s => stageCounts[s] = _masterBrands.filter(b => b.stage === s).length);

  // Summary stats
  const total      = _masterBrands.length;
  const active     = _masterBrands.filter(b => b.stage === 'Active').length;
  const onboarding = _masterBrands.filter(b => b.stage === 'Onboarding').length;
  const paused     = _masterBrands.filter(b => b.stage === 'Paused').length;
  const p0         = _masterBrands.filter(b => b.priority === 'P0').length;

  // Priority chip
  const prioColor = p => ({ P0:'#dc2626', P1:'#b45309', P2:'#0891b2', P3:'#16a34a', P4:'#9ca3af' }[p] || '#888');

  // Health badge
  const healthBadge = h => {
    if (!h) return '';
    const cls = {
      'Optimized':'optimized','On Track':'ontrack','Working':'working',
      'Pending':'pending','Pending ':'pending','CRITICAL':'critical',
      'URGENT':'urgent','Issue':'issue','Drafts':'drafts',
      'TT Violation':'violation','Review':'review','Optimized':'optimized',
    };
    const key = h.trim();
    const c = cls[key] || 'pending';
    return `<span class="health-badge health-${c}">${key}</span>`;
  };

  let html = '';

  // Top stats
  html += `<div class="metrics" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px">
    <div class="metric"><div class="metric-label">Total brands</div><div class="metric-val">${total}</div><div class="metric-sub">in master sheet</div></div>
    <div class="metric"><div class="metric-label">Active</div><div class="metric-val" style="color:#16a34a">${active}</div><div class="metric-sub">live on TikTok Shop</div></div>
    <div class="metric"><div class="metric-label">Onboarding</div><div class="metric-val" style="color:#1d4ed8">${onboarding}</div><div class="metric-sub">in progress</div></div>
    <div class="metric"><div class="metric-label">Paused</div><div class="metric-val" style="color:#b45309">${paused}</div><div class="metric-sub">on hold</div></div>
    <div class="metric"><div class="metric-label">P0 Brands</div><div class="metric-val" style="color:#dc2626">${p0}</div><div class="metric-sub">highest priority</div></div>
  </div>`;

  // Stage filter pills
  html += `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    <span style="font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em">Filter by stage:</span>
    ${stages.map(s => {
      const st = MS_STAGE_STYLE[s] || {};

// ─── CONTRACTS VIEW (Master Sheet) ───────────────────────────────────────────
function setContractFilter(type, val) {
  _contractFilters[type] = _contractFilters[type] === val ? null : val;
  refreshContracts();
}
function setContractSort(field) {
  if (_contractSort === field) _contractSortDir *= -1;
  else { _contractSort = field; _contractSortDir = field === 'brand' ? 1 : 1; }
  refreshContracts();
}

function expiryInfo(dateStr) {
  if (!dateStr || dateStr === '#N/A' || dateStr === 'N/A' || dateStr === '') return { label:'N/A', cls:'exp-na', days:null };
  const d = new Date(dateStr);
  if (isNaN(d)) return { label:'N/A', cls:'exp-na', days:null };
  const days = Math.floor((d - Date.now()) / 86400000);
  if (days < 0)   return { label:`Expired ${Math.abs(days)}d ago`, cls:'exp-expired', days };
  if (days <= 60) return { label:`${days}d left`, cls:'exp-soon', days };
  const fmt = d.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
  return { label: fmt, cls:'exp-ok', days };
}

function refreshContracts() {
  const el = document.getElementById('contracts-content');
  if (!el) return;
  if (!_masterBrands.length) {
    el.innerHTML = '<div class="state-box"><div class="spinner"></div>Loading…</div>';
    return;
  }

  // Only brands that have binding info
  const allBrands = _masterBrands;

  // Metrics
  const withBinding    = allBrands.filter(b => b.binding && b.binding !== 'No' && b.binding !== '');
  const noBinding      = allBrands.filter(b => !b.binding || b.binding === 'No');
  const expired        = allBrands.filter(b => { const {days} = expiryInfo(b.bindingEndDate); return days !== null && days < 0; });
  const expiringSoon   = allBrands.filter(b => { const {days} = expiryInfo(b.bindingEndDate); return days !== null && days >= 0 && days <= 60; });

  // Get distinct AMs for filter
  const amList = [...new Set(allBrands.map(b => b.am).filter(Boolean))].sort();

  // Apply filters
  let filtered = allBrands.slice();
  if (_contractFilters.am)     filtered = filtered.filter(b => b.am === _contractFilters.am);
  if (_contractFilters.health) filtered = filtered.filter(b => b.health === _contractFilters.health);
  if (_contractFilters.expiry === 'expired')  filtered = filtered.filter(b => { const {days} = expiryInfo(b.bindingEndDate); return days !== null && days < 0; });
  if (_contractFilters.expiry === 'soon')     filtered = filtered.filter(b => { const {days} = expiryInfo(b.bindingEndDate); return days !== null && days >= 0 && days <= 60; });
  if (_contractFilters.expiry === 'ok')       filtered = filtered.filter(b => { const {days} = expiryInfo(b.bindingEndDate); return days !== null && days > 60; });
  if (_contractFilters.expiry === 'nodate')   filtered = filtered.filter(b => expiryInfo(b.bindingEndDate).days === null);

  // Sort
  filtered.sort((a, b) => {
    let va, vb;
    if (_contractSort === 'endDate') {
      const da = expiryInfo(a.bindingEndDate).days; const db = expiryInfo(b.bindingEndDate).days;
      if (da === null && db === null) return 0;
      if (da === null) return 1;
      if (db === null) return -1;
      va = da; vb = db;
    } else if (_contractSort === 'brand') { va = a.brand?.toLowerCase(); vb = b.brand?.toLowerCase(); }
    else if (_contractSort === 'am')      { va = a.am?.toLowerCase()||''; vb = b.am?.toLowerCase()||''; }
    else if (_contractSort === 'baStatus'){ va = a.baStatus||''; vb = b.baStatus||''; }
    if (va < vb) return _contractSortDir;
    if (va > vb) return -_contractSortDir;
    return 0;
  });

  const arrow = d => d === 1 ? ' ↓' : ' ↑';
